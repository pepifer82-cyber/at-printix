name: Build A&T Printer Agent 0.5.4

on:
  push:
    branches:
      - agent-v0.5.4-build
    paths:
      - .github/workflows/build-agent-v0.5.4.yml
      - agent/patch-parts/*.txt
      - agent/verify-build.ps1
      - agent/apply-installer-cleaninstall.ps1
      - agent/RELEASE_NOTES_0.5.4.md
      - agent/rebuild-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build definition
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify official 0.5.3 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/pepifer82-cyber/at-printix/releases/download/agent-v0.5.3/agent-v0.5.3-source.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'agent-v0.5.3-source.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $expected = 'cf15688c17042b3f7eebfb57ca96f7e44f794882c4d33eb3eb2afdee0f9ec818'
          Write-Host "Source SHA256: $hash"
          if ($hash -ne $expected) { throw "Official source hash mismatch." }
          $srcRoot = Join-Path $env:GITHUB_WORKSPACE 'agent-v0.5.3'
          Expand-Archive -Path $zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          if (-not (Test-Path (Join-Path $srcRoot 'build.bat'))) { throw 'Source root is incomplete.' }
          "SOURCE_ROOT=$srcRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply 0.5.4 source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Join-Path $env:RUNNER_TEMP 'agent-v0.5.4.patch'
          $partsDir = Join-Path $env:GITHUB_WORKSPACE 'agent/patch-parts'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $writer = [System.IO.StreamWriter]::new($patch, $false, $utf8)
          try {
            1..8 | ForEach-Object {
              $part = Join-Path $partsDir ('part-{0:d2}.txt' -f $_)
              if (-not (Test-Path $part)) { throw "Missing patch segment: $part" }
              $segment = [System.IO.File]::ReadAllText($part, [System.Text.Encoding]::UTF8)
              $segment = $segment.Replace([string][char]13 + [char]10, [string][char]10).Replace([string][char]13, [string][char]10)
              $writer.Write($segment)
            }
          } finally {
            $writer.Dispose()
          }
          $patchHash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLower()
          Write-Host "Patch checksum: $patchHash"
          $expectedPatchHash = '1ee1be7dc4525ce712908b2470578051555ae6663a2fbafd70889c404b755e6d'
          if ($patchHash -ne $expectedPatchHash) { throw 'Reconstructed patch checksum mismatch.' }

          # The installer script and README are handled separately below; apply
          # all agent source/code/test changes against the exact official 0.5.3 tree.
          git -C $env:SOURCE_ROOT apply --check --exclude='AandTPrinterAgent.iss' --exclude='README.txt' -p2 $patch
          if ($LASTEXITCODE -ne 0) { throw 'Agent code patch validation failed.' }
          git -C $env:SOURCE_ROOT apply --exclude='AandTPrinterAgent.iss' --exclude='README.txt' -p2 $patch
          if ($LASTEXITCODE -ne 0) { throw 'Agent code patch application failed.' }

          & (Join-Path $env:GITHUB_WORKSPACE 'agent/apply-installer-cleaninstall.ps1') -SourceRoot $env:SOURCE_ROOT

          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'agent/verify-build.ps1') (Join-Path $env:SOURCE_ROOT 'verify-build.ps1') -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'agent/RELEASE_NOTES_0.5.4.md') (Join-Path $env:SOURCE_ROOT 'RELEASE_NOTES_0.5.4.md') -Force
          Remove-Item (Join-Path $env:SOURCE_ROOT 'RELEASE_NOTES_0.5.3.md') -Force

      - name: Create source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcZip = Join-Path $env:GITHUB_WORKSPACE 'agent-v0.5.4-source.zip'
          Compress-Archive -Path (Join-Path $env:SOURCE_ROOT '*') -DestinationPath $srcZip -CompressionLevel Optimal
          if (-not (Test-Path $srcZip)) { throw 'Source archive was not created.' }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after installation.' }

      - name: Build, test and verify x64/x86 installers
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\agent-v0.5.3"
          set AT_SKIP_SIGNING=1
          call build.bat
          if errorlevel 1 exit /b 1
          if not exist "Instalar_ATPrinterAgent_v0.5.4.exe" exit /b 1
          if not exist "SHA256SUMS.txt" exit /b 1

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: AandT-Printer-Agent-0.5.4
          path: |
            agent-v0.5.3/Instalar_ATPrinterAgent_v0.5.4.exe
            agent-v0.5.3/SHA256SUMS.txt
            agent-v0.5.4-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'agent-v0.5.4'
          gh release create $tag `
            'agent-v0.5.3/Instalar_ATPrinterAgent_v0.5.4.exe' `
            'agent-v0.5.3/SHA256SUMS.txt' `
            'agent-v0.5.4-source.zip' `
            --repo 'pepifer82-cyber/at-printix' `
            --target 'agent-v0.5.4-build' `
            --title 'A&T Printer Agent 0.5.4' `
            --notes-file 'agent-v0.5.3/RELEASE_NOTES_0.5.4.md'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
